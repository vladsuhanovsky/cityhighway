name: Unity Edit Mode tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  editmode:
    name: Edit Mode / Unity 6000.6.8f1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.6.8f1-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.6.8f1-
      - name: Check Unity license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_LICENSE_FILE: ${{ secrets.UNITY_LICENSE_FILE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        shell: bash
        run: |
          if [[ -n "$UNITY_LICENSE" || -n "$UNITY_LICENSE_FILE" || -n "$UNITY_LICENSING_SERVER" ]]; then
            echo "Unity license configuration detected."
          elif [[ -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "Unity account credentials detected."
          else
            echo "::error title=Unity license not configured::Set UNITY_EMAIL and UNITY_PASSWORD for Unity Personal, or configure an appropriate GameCI Unity licensing method in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Run Unity Edit Mode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE_FILE: ${{ secrets.UNITY_LICENSE_FILE }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        with:
          projectPath: .
          unityVersion: 6000.6.8f1
          testMode: editmode
          cliVersion: v0.1.76
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit localization coverage
        if: always()
        run: python3 Tools/localization_audit.py --output artifacts/localization-audit.json
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: artifacts/
          if-no-files-found: warn
