name: Social replay submission guard

on:
  pull_request:
    paths:
      - "Server/supabase/functions/social/**"
      - "Assets/CityHighways/Presentation/SocialCloud*.cs"
      - "Assets/CityHighways/Presentation/SocialReportOutbox.cs"
      - "Assets/CityHighways/Presentation/SocialReportAck.cs"
      - "Assets/CityHighways/Presentation/SocialReadContracts.cs"
      - "Assets/CityHighways/Presentation/Replays.cs"
      - "Assets/CityHighways/Presentation/ReplayStorageIO.cs"
      - "Assets/CityHighways/Presentation/ReplayRetention.cs"
      - "Assets/CityHighways/Presentation/ReplayIndexTransaction.cs"
      - "Assets/CityHighways/Presentation/ReplayLocalSanity.cs"
      - "Assets/CityHighways/Tests/ReplayRetentionTests.cs"
      - "Assets/CityHighways/Tests/ReplayIndexTransactionTests.cs"
      - "Assets/CityHighways/Tests/ReplayLocalSanityTests.cs"
      - "Assets/CityHighways/Tests/ReplayStorageIOTests.cs"
      - "Assets/CityHighways/Presentation/SocialReplayMatch.cs"
      - "Assets/CityHighways/Presentation/SocialReplayFlights.cs"
      - "Assets/CityHighways/Tests/SocialReplayFlightsTests.cs"
      - "Assets/CityHighways/Presentation/Ghosts.cs"
      - "Assets/CityHighways/Tests/SocialReplaySafetyTests.cs"
      - "Assets/CityHighways/Tests/SocialReadContractsTests.cs"
      - "Assets/CityHighways/Presentation/SocialAccountScope.cs"
      - "Assets/CityHighways/Presentation/SocialRequestGate.cs"
      - "Assets/CityHighways/Tests/SocialRequestGateTests.cs"
      - "Assets/CityHighways/Presentation/CloudProfiles.cs"
      - "Assets/CityHighways/Presentation/MenuClubPage.cs"
      - "Assets/CityHighways/Tests/SocialAccountScopeTests.cs"
      - "Assets/CityHighways/Tests/SocialReportAckTests.cs"
      - "Server/supabase/migrations/20261125_idempotent_social_records.sql"
      - ".github/workflows/social-replay-validation.yml"
  push:
    branches: [main]
    paths:
      - "Server/supabase/functions/social/**"
      - "Assets/CityHighways/Presentation/SocialCloud*.cs"
      - "Assets/CityHighways/Presentation/SocialReportOutbox.cs"
      - "Assets/CityHighways/Presentation/SocialReportAck.cs"
      - "Assets/CityHighways/Presentation/SocialReadContracts.cs"
      - "Assets/CityHighways/Presentation/Replays.cs"
      - "Assets/CityHighways/Presentation/ReplayStorageIO.cs"
      - "Assets/CityHighways/Presentation/ReplayRetention.cs"
      - "Assets/CityHighways/Presentation/ReplayIndexTransaction.cs"
      - "Assets/CityHighways/Presentation/ReplayLocalSanity.cs"
      - "Assets/CityHighways/Tests/ReplayRetentionTests.cs"
      - "Assets/CityHighways/Tests/ReplayIndexTransactionTests.cs"
      - "Assets/CityHighways/Tests/ReplayLocalSanityTests.cs"
      - "Assets/CityHighways/Tests/ReplayStorageIOTests.cs"
      - "Assets/CityHighways/Presentation/SocialReplayMatch.cs"
      - "Assets/CityHighways/Presentation/SocialReplayFlights.cs"
      - "Assets/CityHighways/Tests/SocialReplayFlightsTests.cs"
      - "Assets/CityHighways/Presentation/Ghosts.cs"
      - "Assets/CityHighways/Tests/SocialReplaySafetyTests.cs"
      - "Assets/CityHighways/Tests/SocialReadContractsTests.cs"
      - "Assets/CityHighways/Presentation/SocialAccountScope.cs"
      - "Assets/CityHighways/Presentation/SocialRequestGate.cs"
      - "Assets/CityHighways/Tests/SocialRequestGateTests.cs"
      - "Assets/CityHighways/Presentation/CloudProfiles.cs"
      - "Assets/CityHighways/Presentation/MenuClubPage.cs"
      - "Assets/CityHighways/Tests/SocialAccountScopeTests.cs"
      - "Assets/CityHighways/Tests/SocialReportAckTests.cs"
      - "Server/supabase/migrations/20261125_idempotent_social_records.sql"
      - ".github/workflows/social-replay-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-guard:
    name: Node replay intake regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate replay consistency and decompression bounds
        run: node --test Server/supabase/functions/social/*.test.mjs
      - name: Confirm all social report handlers use validation
        shell: bash
        run: |
          grep -q 'await validateReplayReport(body)' Server/supabase/functions/social/index.ts
          grep -q 'import { validateReplayReport }' Server/supabase/functions/social/index.ts
          grep -q 'await replayFingerprint(mode, mapPath, validated.replay)' Server/supabase/functions/social/index.ts
          grep -q 'await upsertPersonalBest(db, me, row)' Server/supabase/functions/social/index.ts
          grep -q 'await creditClubGameOnce(db,' Server/supabase/functions/social/index.ts
          grep -q 'await magnateReportFingerprint(body)' Server/supabase/functions/social/index.ts
          grep -q 'runId = game.ReportRunId' Assets/CityHighways/Presentation/SocialCloud.cs
          grep -q 'club.amount' Server/README.md
